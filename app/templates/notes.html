{% extends 'base.html' %}{% block title %}My notes · CampusBeacon{% endblock %}{% block content %}<div class="container py-5"><div class="row g-4"><div class="col-lg-5"><span class="eyebrow">PERSONAL SPACE</span><h1>Sticky notes</h1><form class="panel mt-4" method="post"><label class="form-label">Title<input class="form-control" name="title" required maxlength="140"></label><label class="form-label">Note<textarea class="form-control" name="content" rows="5" required></textarea></label><label class="form-check mb-3"><input class="form-check-input" type="checkbox" name="is_pinned"> Pin this note</label><button class="btn btn-primary">Save note</button></form></div><div class="col-lg-7">{% for n in notes %}<div class="note note-large"><div class="d-flex justify-content-between"><h3>{{ n.title }}</h3><form method="post" action="{{ url_for('main.delete_note',note_id=n.id) }}"><button class="btn btn-sm btn-link text-danger">Delete</button></form></div><p>{{ n.content }}</p></div>{% else %}<div class="empty">Your personal notes will appear here.</div>{% endfor %}</div></div></div>{% endblock %}
